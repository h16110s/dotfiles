##### 基本設定 #####

# プレフィックスキー Ctrl+a へ変更（デフォルトの Ctrl+b を無効化）
set-option -g prefix C-q
unbind-key C-b
bind-key C-a send-prefix

# マウス操作を有効化（ペイン選択/リサイズ/スク���ール等に対応）
set-option -g mouse on

# ウィンドウ番号とペイン番号を1始まりに
set-option -g base-index 1
setw -g pane-base-index 1

# 256色サポート（カラースキームや便利ツールのため）
set-option -g default-terminal "screen-256color"

# 履歴バッファ拡大（たくさんスクロールできるように）
set-option -g history-limit 50000

# ウィンドウ名自動リネーム無効化（コマンド実行ごとに名前が変わらないように）
set-option -g allow-rename off

##### ステータスラインのカスタマイズ #####

# ステータスバーの色と表示内容
set-option -g status-bg colour235
set-option -g status-fg colour136
set-option -g status-interval 5
set-option -g status-left "#S "      # セッション名を左端に表示
set-option -g status-right "%H:%M %d-%b-%y"  # 右端に時刻と日付

##### コピーモード：Vimキーバインド #####

# コピーモードでVim操作（vで選択開始、yでコピー）
set-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

##### 画面分割／ペイン操作のキーバインド #####

# 水平分割（横に分割）：プレフィックス + -
bind - split-window -v

# 垂直分割（縦に分割）：プレフィックス + \\
bind \ split-window -h

# Ctrl+h/j/k/l でペイン移動（Vim風）
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# ペインサイズ調整（H/J/K/L で一度に5文字分変更、プレフィックス押しながらHなど）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5